kubeProxyReplacement: true
k8sServiceHost: "<{ kubernetes-api-hostname }>"
k8sServicePort: 6443
routingMode: tunnel
tunnelProtocol: vxlan
operator:
  replicas: 2
encryption:
  enabled: <{ cilium-wireguard-enabled }>
  type: wireguard
  nodeEncryption: <{ cilium-wireguard-enabled }>
ingressController:
  enabled: <{ cilium-ingress-enabled }>
  default: true
  loadbalancerMode: shared
  service:
    type: NodePort
    insecureNodePort: 32080
    secureNodePort: 32443
    externalTrafficPolicy: Cluster
