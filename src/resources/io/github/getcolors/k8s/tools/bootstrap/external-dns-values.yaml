provider:
  name: cloudflare
policy: "<{ external-dns-policy }>"
registry: txt
txtOwnerId: "<{ profile }>"
domainFilters:
  - "<{ cloudflare-zone }>"
env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token
        key: api-token
extraArgs:
  cloudflare-proxied: "<{ external-dns-cloudflare-proxied }>"
