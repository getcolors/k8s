---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: colors-app
  namespace: flux-system
spec:
  interval: 1m
  url: "https://github.com/getcolors/k8s-helloworld.git"
  ref:
    branch: "main"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: colors-app
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 10m
  path: "./clusters/k8s-digitalocean"
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: colors-app
