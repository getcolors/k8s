kubeProxyReplacement: true
k8sServiceHost: "api.k8s.fixture.example"
k8sServicePort: 6443
routingMode: tunnel
tunnelProtocol: vxlan
operator:
  replicas: 2
encryption:
  enabled: true
  type: wireguard
  nodeEncryption: true
ingressController:
  enabled: true
  default: true
  loadbalancerMode: shared
  service:
    type: NodePort
    insecureNodePort: 32080
    secureNodePort: 32443
    externalTrafficPolicy: Cluster
