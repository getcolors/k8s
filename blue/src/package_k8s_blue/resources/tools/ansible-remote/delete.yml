---
- name: Remove Kubernetes-managed cloud resources before destroying nodes
  hosts: control_plane
  become: true
  gather_facts: false
  tasks:
    - name: Confirm Kubernetes API is reachable
      ansible.builtin.command: >-
        kubectl --kubeconfig=/etc/kubernetes/admin.conf get --raw=/readyz
      changed_when: false

    # external-dns runs with policy sync (k8s-helloworld), so pruning the
    # application is what withdraws its records — and that must happen while
    # external-dns still runs, i.e. before the GitOps Kustomization below
    # takes the controllers with it. Without this the A and TXT records for
    # the application host outlive the cluster, pointing at a load balancer
    # that no longer exists (seen live on 2026-09-05).
    #
    # Fail closed, not open: an ingress for the host with no external-dns to
    # withdraw it stops the delete, because destroying the cluster then would
    # leave the records behind for good. With no ingress there is nothing to
    # withdraw (a create that never reached the application), and the delete
    # proceeds.
    - name: Find the ingress for <{ application-host }>
      ansible.builtin.shell: >-
        kubectl --kubeconfig=/etc/kubernetes/admin.conf get ingress -A
        -o jsonpath='{range .items[*]}{.spec.rules[*].host}{"\n"}{end}'
        | grep -x '<{ application-host }>'
      register: k8s_app_ingress
      changed_when: false
      failed_when: false

    - name: Check whether external-dns is running
      ansible.builtin.command: >-
        kubectl --kubeconfig=/etc/kubernetes/admin.conf -n external-dns
        get deployment external-dns-external-dns -o name
      register: k8s_external_dns
      changed_when: false
      failed_when: false

    - name: Refuse to destroy a cluster whose records nothing can withdraw
      ansible.builtin.fail:
        msg: >-
          <{ application-host }> still has an ingress but external-dns is not
          running, so its DNS records cannot be withdrawn; reconcile the
          controllers (flux) or remove the records by hand, then retry the delete
      when: k8s_app_ingress.rc == 0 and k8s_external_dns.rc != 0

    # The withdrawal is looked for only after this instant, so a log line
    # from an earlier delete cycle cannot stand in for the current one.
    - name: Mark the moment before the application is pruned
      ansible.builtin.command: date -u +%Y-%m-%dT%H:%M:%SZ
      register: k8s_prune_started
      changed_when: false

    - name: Delete the application Kustomization so external-dns withdraws its records
      ansible.builtin.command: >-
        kubectl --kubeconfig=/etc/kubernetes/admin.conf -n flux-system
        delete kustomization apps --ignore-not-found=true
        --wait=true --timeout=600s
      changed_when: true

    - name: Wait for external-dns to withdraw <{ application-host }>
      ansible.builtin.shell: >-
        kubectl --kubeconfig=/etc/kubernetes/admin.conf -n external-dns
        logs deployment/external-dns-external-dns
        --since-time={{ k8s_prune_started.stdout }}
        | grep -q 'action=DELETE record=<{ application-host }> '
      register: k8s_dns_withdrawn
      until: k8s_dns_withdrawn.rc == 0
      retries: 30
      delay: 10
      changed_when: false
      when: k8s_app_ingress.rc == 0

    - name: Delete the GitOps Kustomization and prune its inventory
      ansible.builtin.command: >-
        kubectl --kubeconfig=/etc/kubernetes/admin.conf -n flux-system
        delete kustomization colors-app --ignore-not-found=true
        --wait=true --timeout=600s
      changed_when: true

    - name: Explicitly remove ingress LoadBalancer service
      ansible.builtin.command: >-
        kubectl --kubeconfig=/etc/kubernetes/admin.conf -n ingress-nginx
        delete service
        --selector=app.kubernetes.io/component=controller,app.kubernetes.io/name=ingress-nginx
        --ignore-not-found=true --wait=true --timeout=600s
      changed_when: true

    - name: Remove ingress namespace
      ansible.builtin.command: >-
        kubectl --kubeconfig=/etc/kubernetes/admin.conf
        delete namespace ingress-nginx --ignore-not-found=true
        --wait=true --timeout=600s
      changed_when: true

    - name: Delete the GitOps source
      ansible.builtin.command: >-
        kubectl --kubeconfig=/etc/kubernetes/admin.conf -n flux-system
        delete gitrepository colors-app --ignore-not-found=true
      changed_when: true
